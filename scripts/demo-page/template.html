// Language before first paint: ?lang=es|en wins, then a Spanish browser, then English.
(function () {
  var q = new URLSearchParams(location.search).get('lang');
  var lang = q === 'es' || q === 'en' ? q : (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
  document.documentElement.lang = lang;
  document.documentElement.setAttribute('data-lang', lang);
})();
</script>
